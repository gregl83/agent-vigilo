coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "vigilo/src/db/workflows/**/postgres_tests.rs"
  - "vigilo/src/db/workflows/**/postgres_tests/**"

flags:
  rust-all:
    paths:
      - vigilo/src
      - evaluators/sentiment-basic-en/src
    carryforward: false
